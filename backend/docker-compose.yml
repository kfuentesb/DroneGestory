services:
  postgres:
    image: postgres:16
    container_name: aeronaves_db
    environment:
      POSTGRES_DB: aeronaves_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    command: postgres -c listen_addresses='*' -c timezone=Europe/Madrid -c log_timezone=Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
    name: dronegestory_postgres_data
