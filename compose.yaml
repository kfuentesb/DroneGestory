services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dronegestory-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}?options=-c%20TimeZone%3DEurope%2FMadrid
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_FRONTEND_URL=https://quizzical-morse.213-165-78-203.plesk.page
      - EMAIL_USER=${EMAIL_USER:?EMAIL_USER is required}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:?EMAIL_PASSWORD is required}
      - APP_UPLOADS_ROOT=/app/uploads
      - APP_BACKUPS_ROOT=/app/backups
      - APP_AUDIT_LOGS_ROOT=/app/AuditLogs
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/AuditLogs:/app/AuditLogs
      - ./backups:/app/backups
    networks:
      - drone_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # args:
      #   - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: dronegestory-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - drone_network

  db:
    image: postgres:16
    container_name: dronegestory-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    command: postgres -c timezone=Europe/Madrid -c log_timezone=Europe/Madrid
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drone_network

volumes:
  postgres_data:
    name: dronegestory_postgres_data

networks:
  drone_network:
    driver: bridge
