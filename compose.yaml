services:
  backend:
    build:
      context: ./backend
    container_name: dronegestory-backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/aeronaves_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - drone_network

  frontend:
    build:
      context: ./frontend
    container_name: dronegestory-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - drone_network

  db:
    image: postgres:16
    container_name: dronegestory-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: aeronaves_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drone_network

volumes:
  postgres_data:

networks:
  drone_network:
    driver: bridge